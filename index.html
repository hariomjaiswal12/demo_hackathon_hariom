<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DeskDrop — Internal Office Resource & Asset Booking System. Reserve meeting rooms, audio equipment, displays, and more." />
    <meta name="theme-color" content="#4F46E5" />
    <title>DeskDrop — Office Resource Booking</title>
    <!-- FOUC Prevention: Apply theme before React renders -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('deskdrop-theme');
          var isDark = saved === 'dark' || 
            ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
